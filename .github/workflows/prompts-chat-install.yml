name: Verify Prompts.chat integration

on:
  push:
    branches:
      - integration/prompts-chat
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prompts_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d prompts_chat"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prompts_chat?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/prompts_chat?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: axioglobe-prompts-chat-ci-secret
      CRON_SECRET: axioglobe-prompts-chat-ci-cron

    steps:
      - name: Checkout AxioGlobe repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/prompts-chat/package-lock.json

      - name: Install Prompts.chat dependencies
        working-directory: integrations/prompts-chat
        run: npm ci

      - name: Apply database migrations
        working-directory: integrations/prompts-chat
        run: npx prisma migrate deploy

      - name: Verify Prisma client generation
        working-directory: integrations/prompts-chat
        run: npx prisma generate

      - name: Run Prompts.chat tests
        working-directory: integrations/prompts-chat
        run: npm test
