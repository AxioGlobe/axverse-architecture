name: Publish AxioGlobe Prompt Registry image

on:
  push:
    branches:
      - main
    paths:
      - 'integrations/prompts-chat'
      - '.github/workflows/prompts-chat-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Prompts.chat submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AxioGlobe Prompt Registry
        uses: docker/build-push-action@v6
        with:
          context: ./integrations/prompts-chat
          file: ./integrations/prompts-chat/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/axioglobe/prompts-chat:latest
            ghcr.io/axioglobe/prompts-chat:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=AxioGlobe Prompt Registry
            org.opencontainers.image.description=AxioGlobe self-hosted prompt and agent registry
            org.opencontainers.image.source=https://github.com/AxioGlobe/axverse-architecture
